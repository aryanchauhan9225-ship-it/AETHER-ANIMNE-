# AETHER — Episode 1 "एक नई शुरुआत" (Ek Nayi Shuruaat / A New Beginning)
# SINGLE SOURCE OF TIMING. All other Ep01 documents follow this file.
# 24 fps · 1920x1080 · 1200 frames = 50.000 s
# Frames are 0-based and the end frame is excluded: a shot covers [start, end).
# Timecodes are seconds from episode start.
# level: A = full frame-by-frame (on 2s) · B = limited animation (on 3s) · C = drawn layers + camera + FX
# Status: SCRIPT LOCK CANDIDATE (gate G2). No artwork or animation exists yet.

episode:
  id: ep01
  title_hi: "एक नई शुरुआत"
  title_rom: "Ek Nayi Shuruaat"
  title_en: "A New Beginning"
  fps: 24
  width: 1920
  height: 1080
  total_frames: 1200

scenes:
  - { id: SC1, name: "Cold open — narration",       start: 0,    end: 96 }
  - { id: SC2, name: "Previous life & regrets",     start: 96,   end: 264 }
